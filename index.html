
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- SEO -->
    <meta
      name="description"
      content="IGtrade is a trading dashboard where users can explore market activity, monitor trades and manage their trading accounts."
    />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <title>IGtrade — Trading Platform</title>

    <!-- IGtrade Browser Logo -->
    <link rel="icon" type="image/svg+xml" href="/igtrade-icon.svg" />
    <link rel="apple-touch-icon" href="/ig-logo.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Telegram / Facebook / Discord Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IGtrade" />
    <meta property="og:title" content="IGtrade — Trading Platform" />
    <meta
      property="og:description"
      content="Welcome to IGtrade. Explore our trading platform, monitor market activity and manage your trading dashboard."
    />
    <meta
      property="og:image"
      content="https://igtradeplatforms.vercel.app/ig-logo.png"
    />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:url" content="https://igtradeplatforms.vercel.app/" />

    <!-- Twitter Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IGtrade — Trading Platform" />
    <meta
      name="twitter:description"
      content="Welcome to IGtrade. Explore our trading platform, monitor market activity and manage your trading dashboard."
    />
    <meta
      name="twitter:image"
      content="https://igtradeplatforms.vercel.app/ig-logo.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
